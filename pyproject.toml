[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-stream-lease"
version = "0.6.4"
description = "Distributed stream and SSE concurrency lease manager for FastAPI and Starlette backed by atomic Redis Lua scripts."
readme = "README.md"
authors = [
    { name = "Agustin Saiz", email = "agustinsaiz02@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "concurrency",
    "concurrency-control",
    "distributed-lock",
    "fastapi",
    "llm-streaming",
    "rate-limiting",
    "redis",
    "semaphore",
    "server-sent-events",
    "sse",
    "starlette",
    "streaming",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "redis>=4.6.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
]
prometheus = [
    "prometheus-client>=0.20.0",
]
otel = [
    "opentelemetry-api>=1.45.1",
]
all = [
    "fastapi>=0.100.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.45.1",
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.29.0",
    "pymdown-extensions>=10.0",
    "ruff>=0.4.0",
]
dev = [
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "fakeredis[lua]>=2.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "codespell>=2.2.0",
]

[dependency-groups]
demo = [
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/agustin18/fastapi-stream-lease"
Documentation = "https://agustin18.github.io/fastapi-stream-lease/"
Repository = "https://github.com/agustin18/fastapi-stream-lease"
Issues = "https://github.com/agustin18/fastapi-stream-lease/issues"
Changelog = "https://github.com/agustin18/fastapi-stream-lease/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_stream_lease"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=fastapi_stream_lease --cov-branch --cov-fail-under=100 --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "ASYNC", # flake8-async
    "PERF",  # perflint (performance anti-patterns)
    "RUF",   # ruff-specific rules
    "T20",   # flake8-print (disallow print in src/)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "SIM", "ASYNC", "PERF", "RUF006"]
"benchmarks/*" = ["T20"]
"examples/*" = ["T20"]

[tool.codespell]
skip = "*.lock,*.xml,.git,.venv,.mypy_cache,.pytest_cache,dist,site"
ignore-words-list = "crate"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
