[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-stream-lease"
version = "0.1.1"
description = "Distributed stream and SSE concurrency lease manager for FastAPI and Starlette backed by atomic Redis Lua scripts."
readme = "README.md"
authors = [
    { name = "Agustin Saiz", email = "agustinsaiz02@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "fastapi",
    "starlette",
    "sse",
    "server-sent-events",
    "streaming",
    "concurrency",
    "rate-limiting",
    "redis",
    "llm-streaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
]
dev = [
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "fakeredis[lua]>=2.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/agustin18/fastapi-stream-lease"
Repository = "https://github.com/agustin18/fastapi-stream-lease"
Issues = "https://github.com/agustin18/fastapi-stream-lease/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_stream_lease"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=fastapi_stream_lease --cov-branch --cov-fail-under=95 --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
