services:
  redis-cluster-1:
    image: redis:7-alpine
    command: redis-server --port 7000 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 2000 --save "" --appendonly no --enable-debug-command yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - cluster-net

  redis-cluster-2:
    image: redis:7-alpine
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 2000 --save "" --appendonly no --enable-debug-command yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - cluster-net

  redis-cluster-3:
    image: redis:7-alpine
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 2000 --save "" --appendonly no --enable-debug-command yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - cluster-net

  redis-cluster-4:
    image: redis:7-alpine
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 2000 --save "" --appendonly no --enable-debug-command yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - cluster-net

  redis-cluster-5:
    image: redis:7-alpine
    command: redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 2000 --save "" --appendonly no --enable-debug-command yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - cluster-net

  redis-cluster-6:
    image: redis:7-alpine
    command: redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 2000 --save "" --appendonly no --enable-debug-command yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      - cluster-net

  cluster-init:
    image: redis:7-alpine
    depends_on:
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
      redis-cluster-4:
        condition: service_healthy
      redis-cluster-5:
        condition: service_healthy
      redis-cluster-6:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "yes" | redis-cli --cluster create \
          redis-cluster-1:7000 redis-cluster-2:7001 redis-cluster-3:7002 \
          redis-cluster-4:7003 redis-cluster-5:7004 redis-cluster-6:7005 \
          --cluster-replicas 1
        
        NODES="redis-cluster-1:7000 redis-cluster-2:7001 redis-cluster-3:7002 redis-cluster-4:7003 redis-cluster-5:7004 redis-cluster-6:7005"
        for i in $$(seq 1 45); do
          ALL_OK=true
          for node in $$NODES; do
            HOST=$${node%:*}
            PORT=$${node#*:}
            STATE=$$(redis-cli -h $$HOST -p $$PORT cluster info 2>/dev/null | grep cluster_state: | tr -d '\r\n')
            SLOTS=$$(redis-cli -h $$HOST -p $$PORT cluster info 2>/dev/null | grep cluster_slots_assigned: | tr -d '\r\n')
            KNOWN=$$(redis-cli -h $$HOST -p $$PORT cluster info 2>/dev/null | grep cluster_known_nodes: | tr -d '\r\n')
            if [ "$$STATE" != "cluster_state:ok" ] || [ "$$SLOTS" != "cluster_slots_assigned:16384" ] || [ "$$KNOWN" != "cluster_known_nodes:6" ]; then
              ALL_OK=false
              break
            fi
            CNODES=$$(redis-cli -h $$HOST -p $$PORT cluster nodes 2>/dev/null)
            if echo "$$CNODES" | grep -E -q 'fail\?|fail|handshake|disconnected'; then
              ALL_OK=false
              break
            fi
            ROLE=$$(redis-cli -h $$HOST -p $$PORT info replication 2>/dev/null | grep role: | tr -d '\r\n')
            if [ "$$ROLE" = "role:slave" ]; then
              MLINK=$$(redis-cli -h $$HOST -p $$PORT info replication 2>/dev/null | grep master_link_status: | tr -d '\r\n')
              if [ "$$MLINK" != "master_link_status:up" ]; then
                ALL_OK=false
                break
              fi
            fi
          done
          if [ "$$ALL_OK" = "true" ]; then
            echo "All 6 Redis Cluster nodes converged, 16384 slots assigned, replicas linked up, and cluster healthy!"
            exit 0
          fi
          echo "Waiting for symmetric cluster convergence across all 6 nodes (attempt $$i/45)..."
          sleep 1
        done
        echo "Cluster symmetric initialization timed out!"
        exit 1
    networks:
      - cluster-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sleep", "infinity"]
    environment:
      - REDIS_CLUSTER_NODES=redis-cluster-1:7000,redis-cluster-2:7001,redis-cluster-3:7002
    volumes:
      - .:/app
    depends_on:
      cluster-init:
        condition: service_completed_successfully
    networks:
      - cluster-net

networks:
  cluster-net:
    driver: bridge
