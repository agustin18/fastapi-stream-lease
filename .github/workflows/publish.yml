name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pypi-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/fastapi-stream-lease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Verify release tag and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag ({os.environ['RELEASE_TAG']}) does not match pyproject.toml version (v{version})")

          # Verify __init__.py __version__ matches pyproject.toml
          sys.path.insert(0, "src")
          import fastapi_stream_lease
          if fastapi_stream_lease.__version__ != version:
              raise SystemExit(f"Version mismatch: __init__.py ({fastapi_stream_lease.__version__}) != pyproject.toml ({version})")
          print(f"Release tag and package __version__ verified for v{version}")
          PY
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8
        with:
          name: dist-packages
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
