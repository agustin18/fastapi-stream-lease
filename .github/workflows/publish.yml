name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  pypi-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/fastapi-stream-lease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Verify release tag and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag ({os.environ['RELEASE_TAG']}) does not match pyproject.toml version (v{version})")

          # Verify __init__.py __version__ matches pyproject.toml
          import ast
          init_tree = ast.parse(pathlib.Path("src/fastapi_stream_lease/__init__.py").read_text())
          init_version = next(
              node.value.value
              for node in init_tree.body
              if isinstance(node, ast.Assign)
              for target in node.targets
              if isinstance(target, ast.Name) and target.id == "__version__"
          )
          if init_version != version:
              raise SystemExit(f"Version mismatch: __init__.py ({init_version}) != pyproject.toml ({version})")
          print(f"Release tag and package __version__ verified for v{version}")
          PY
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify semantic version bump
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --tags --force
          python scripts/release_version.py --check "$RELEASE_TAG"

      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4.1.8
        with:
          name: dist-packages
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
