name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Checking
        run: uv run mypy src

      - name: Check Spelling (codespell)
        run: uv run codespell

      - name: Audit Dependencies for Known Vulnerabilities (PyPI)
        run: uv run --with pip-audit pip-audit

      - name: Audit Dependencies for Known Vulnerabilities (OSV)
        run: uv run --with pip-audit pip-audit --vulnerability-service osv

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra all --extra docs --python 3.12

      - name: Build documentation
        run: uv run --python 3.12 mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run Pytest with Coverage
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: coverage.xml

  test-redis5:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check Redis 5 compatibility
        run: uv run pytest -o addopts='' tests/test_real_redis.py -q

      - name: Check server compatibility with redis-py 4.6.0
        run: uv run --locked --with "redis==4.6.0" pytest -o addopts='' tests/test_real_redis.py -q

  test-redis8:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check Redis 8 compatibility
        run: uv run pytest -o addopts='' tests/test_real_redis.py -q

      - name: Check server compatibility with redis-py 4.6.0
        run: uv run --locked --with "redis==4.6.0" pytest -o addopts='' tests/test_real_redis.py -q

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Smoke test wrapper overhead benchmark with regression gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.base_ref }}" ]; then
            echo "Calibrating baseline against base branch: ${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}":base_ref --depth=1 --force
            git worktree add /tmp/base-repo base_ref
            PYTHONPATH=/tmp/base-repo/src uv run python benchmarks/bench_wrapper_overhead.py \
              --count 100 \
              --concurrency 1 \
              --max-p99-overhead-ms 5.0 \
              --save-baseline /tmp/base-overhead-baseline.json
            git worktree remove /tmp/base-repo --force
            BASELINE_ARG="--baseline /tmp/base-overhead-baseline.json"
          else
            BASELINE_ARG="--baseline benchmarks/baseline-overhead.json"
          fi
          echo "Running benchmark with $BASELINE_ARG..."
          uv run python benchmarks/bench_wrapper_overhead.py \
            --count 100 \
            --concurrency 1 \
            --max-p99-overhead-ms 5.0 \
            $BASELINE_ARG \
            --max-regression-pct 50.0 \
            --noise-floor-ms 0.20
      - name: Smoke test soak workload
        run: |
          uv run python benchmarks/bench_soak.py --duration 10 --target-concurrency 10 --lease-seconds 4.0 --renew-interval 1.0

  test-sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Redis Sentinel Topology
        run: |
          docker compose -f docker-compose.sentinel.yml up -d --wait sentinel-1 sentinel-2 sentinel-3

      - name: Run Redis Sentinel Integration & Failover Tests (latest redis-py)
        run: |
          docker compose -f docker-compose.sentinel.yml run --rm backend uv run pytest -o addopts='' tests/test_sentinel.py -vv -s

      - name: Run Redis Sentinel Integration & Failover Tests (minimum redis-py==5.0.0 floor)
        run: |
          docker compose -f docker-compose.sentinel.yml run --rm backend uv run --with "redis==5.0.0" pytest -o addopts='' tests/test_sentinel.py -vv -s

      - name: Run Redis Sentinel Integration & Failover Tests (redis-py 4.6.0 floor)
        run: |
          docker compose -f docker-compose.sentinel.yml run --rm backend uv run --with "redis==4.6.0" pytest -o addopts='' tests/test_sentinel.py -vv -s

      - name: Teardown Sentinel Topology
        if: always()
        run: |
          docker compose -f docker-compose.sentinel.yml down -v

  test-redis-py-compat:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        redis-version: ["4.6.0"]
        include:
          - python-version: "3.11"
            redis-version: "5.0.0"
          - python-version: "3.12"
            redis-version: "5.0.0"
          - python-version: "3.11"
            redis-version: "5.3.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies with minimum redis-py floor
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python-version }}
          uv pip install "redis==${{ matrix.redis-version }}"
          uv pip check
          uv run --no-sync --python ${{ matrix.python-version }} python -c 'import redis; assert redis.__version__ == "${{ matrix.redis-version }}", redis.__version__'
      - name: Run complete suite with compatibility client
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest

  # Keep the existing required check name stable while the compatibility matrix grows.
  test-redis-py-min:
    runs-on: ubuntu-latest
    needs: test-redis-py-compat
    if: always()
    steps:
      - name: Require every client compatibility job to pass
        env:
          COMPAT_RESULT: ${{ needs.test-redis-py-compat.result }}
        run: test "$COMPAT_RESULT" = success

  test-fastapi-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Python 3.10
        run: uv python install 3.10
      - name: Install dependencies with minimum FastAPI & Starlette floor
        run: |
          uv sync --locked --extra dev --python 3.10
          uv pip install "fastapi==0.100.0" "starlette==0.27.0"
          uv run --no-sync --python 3.10 python -c 'import fastapi, starlette; assert fastapi.__version__ == "0.100.0"; assert starlette.__version__ == "0.27.0"'
      - name: Run FastAPI integration test suite with floor dependencies
        run: uv run --no-sync --python 3.10 pytest -o addopts='' tests/test_fastapi_integration.py -v

  test-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Redis Cluster Topology
        run: |
          docker compose -f docker-compose.cluster.yml up -d --wait

      - name: Dump cluster logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.cluster.yml logs

      - name: Run Redis Cluster Integration & Failover Tests (latest redis-py)
        run: |
          docker compose -f docker-compose.cluster.yml run --rm backend uv run --all-extras pytest -o addopts='' tests/test_cluster.py -vv -s

      - name: Settle cluster topology before floor test
        run: sleep 5

      - name: Run Redis Cluster Integration & Failover Tests (minimum redis-py==5.0.0 floor)
        run: |
          docker compose -f docker-compose.cluster.yml run --rm backend uv run --with "redis==5.0.0" pytest -o addopts='' tests/test_cluster.py -vv -s

      - name: Run Redis Cluster Integration & Failover Tests (redis-py 4.6.0 floor)
        run: |
          docker compose -f docker-compose.cluster.yml run --rm backend uv run --with "redis==4.6.0" pytest -o addopts='' tests/test_cluster.py -vv -s

      - name: Teardown Redis Cluster Topology
        if: always()
        run: |
          docker compose -f docker-compose.cluster.yml down -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      - name: Verify package version consistency
        run: |
          uv run python - <<'PY'
          import tomllib
          from pathlib import Path
          import fastapi_stream_lease

          toml_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          pkg_version = fastapi_stream_lease.__version__
          if toml_version != pkg_version:
              raise SystemExit(f"Version mismatch: pyproject.toml ({toml_version}) != package __version__ ({pkg_version})")
          print(f"Version consistency verified: {pkg_version}")
          PY

      - name: Clean environment wheel smoke test (core and fastapi extra)
        run: |
          mkdir -p /tmp/smoke-test-fastapi
          cd /tmp/smoke-test-fastapi
          uv venv
          WHEEL_PATH=$(ls $GITHUB_WORKSPACE/dist/*.whl)
          uv pip install "$WHEEL_PATH[fastapi]"
          uv run python - <<'PY'
          import fastapi_stream_lease
          from fastapi_stream_lease import (
              BackendFailurePolicy,
              CircuitBreakerConfig,
              CircuitState,
              FallbackMode,
              LeaseConfig,
              StreamLeaseManager,
              StreamLease,
              StreamLeaseError,
              StreamLeaseRejected,
              StreamLeaseLost,
              StreamLeaseUnavailable,
          )

          config = LeaseConfig(max_per_user=1, max_global=10)
          assert config.max_per_user == 1

          policy = BackendFailurePolicy(circuit_breaker=CircuitBreakerConfig())
          assert policy.fallback_mode == FallbackMode.FAIL_CLOSED
          assert CircuitState.CLOSED.value == "closed"

          # Verify Starlette/FastAPI integration works with installed extra
          err = StreamLeaseRejected("user_limit")
          resp = err.as_response()
          assert resp.status_code == 429
          print(f"Smoke test passed on fastapi-stream-lease {fastapi_stream_lease.__version__} with [fastapi] extra")
          PY

      - name: Clean environment wheel smoke test (prometheus extra)
        run: |
          mkdir -p /tmp/smoke-test-prometheus
          cd /tmp/smoke-test-prometheus
          uv venv
          WHEEL_PATH=$(ls $GITHUB_WORKSPACE/dist/*.whl)
          uv pip install "$WHEEL_PATH[prometheus]"
          uv run python - <<'PY'
          from prometheus_client import CollectorRegistry
          from fastapi_stream_lease.observability.prometheus import PrometheusMetrics

          registry = CollectorRegistry()
          metrics = PrometheusMetrics(registry=registry)
          metrics.record_operation("acquire", "success", 0.012)
          metrics.record_hook_queue_change(1)
          assert registry.get_sample_value("fastapi_stream_lease_hook_queue_depth") == 1.0
          print("Smoke test passed for [prometheus] extra")
          PY

      - name: Clean environment wheel smoke test (otel extra with 1.45.1 floor)
        run: |
          mkdir -p /tmp/smoke-test-otel
          cd /tmp/smoke-test-otel
          uv venv
          WHEEL_PATH=$(ls $GITHUB_WORKSPACE/dist/*.whl)
          uv pip install "$WHEEL_PATH[otel]" "opentelemetry-api==1.45.1"
          uv run python - <<'PY'
          import importlib.metadata
          otel_version = importlib.metadata.version("opentelemetry-api")
          assert otel_version == "1.45.1", f"Expected 1.45.1, got {otel_version}"
          from fastapi_stream_lease.observability.otel import OpenTelemetryMetrics

          otel = OpenTelemetryMetrics()
          otel.record_operation("acquire", "success", 0.012)
          otel.record_hook_queue_change(1)
          print(f"Smoke test passed for [otel] extra with opentelemetry-api=={otel_version}")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

