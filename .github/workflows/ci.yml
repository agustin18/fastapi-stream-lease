name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy Type Checking
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run Pytest with Coverage
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: coverage.xml

  test-redis5:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check Redis 5 compatibility
        run: uv run pytest -o addopts='' tests/test_real_redis.py -q

  test-redis8:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check Redis 8 compatibility
        run: uv run pytest -o addopts='' tests/test_real_redis.py -q

  test-sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Redis Sentinel Topology
        run: |
          docker compose -f docker-compose.sentinel.yml up -d --wait sentinel-1 sentinel-2 sentinel-3

      - name: Run Redis Sentinel Integration & Failover Tests
        run: |
          docker compose -f docker-compose.sentinel.yml run --rm backend uv run pytest -o addopts='' tests/test_sentinel.py -vv -s

      - name: Teardown Sentinel Topology
        if: always()
        run: |
          docker compose -f docker-compose.sentinel.yml down -v

  test-redis-py-min:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies with minimum redis-py floor
        run: |
          uv sync --locked --extra dev --python 3.12
          uv pip install "redis==5.0.0"
      - name: Run test suite with redis-py 5.0.0 floor
        run: uv run --python 3.12 pytest -o addopts=''

  test-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Redis Cluster Topology
        run: |
          docker compose -f docker-compose.cluster.yml up -d --wait

      - name: Dump cluster logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.cluster.yml logs

      - name: Run Redis Cluster Integration & Failover Tests (latest redis-py)
        run: |
          docker compose -f docker-compose.cluster.yml run --rm backend uv run --all-extras pytest -o addopts='' tests/test_cluster.py -vv -s

      - name: Settle cluster topology before floor test
        run: sleep 5

      - name: Run Redis Cluster Integration & Failover Tests (minimum redis-py==5.0.0 floor)
        run: |
          docker compose -f docker-compose.cluster.yml run --rm backend uv run --with "redis==5.0.0" pytest -o addopts='' tests/test_cluster.py -vv -s

      - name: Teardown Redis Cluster Topology
        if: always()
        run: |
          docker compose -f docker-compose.cluster.yml down -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      - name: Verify package version consistency
        run: |
          uv run python - <<'PY'
          import tomllib
          from pathlib import Path
          import fastapi_stream_lease

          toml_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          pkg_version = fastapi_stream_lease.__version__
          if toml_version != pkg_version:
              raise SystemExit(f"Version mismatch: pyproject.toml ({toml_version}) != package __version__ ({pkg_version})")
          print(f"Version consistency verified: {pkg_version}")
          PY

      - name: Clean environment wheel smoke test (core and fastapi extra)
        run: |
          mkdir -p /tmp/smoke-test
          cd /tmp/smoke-test
          uv venv
          WHEEL_PATH=$(ls $GITHUB_WORKSPACE/dist/*.whl)
          uv pip install "$WHEEL_PATH[fastapi]"
          uv run python - <<'PY'
          import fastapi_stream_lease
          from fastapi_stream_lease import (
              LeaseConfig,
              StreamLeaseManager,
              StreamLease,
              StreamLeaseError,
              StreamLeaseRejected,
              StreamLeaseLost,
              StreamLeaseUnavailable,
          )

          config = LeaseConfig(max_per_user=1, max_global=10)
          assert config.max_per_user == 1

          # Verify Starlette/FastAPI integration works with installed extra
          err = StreamLeaseRejected("user_limit")
          resp = err.as_response()
          assert resp.status_code == 429
          print(f"Smoke test passed on fastapi-stream-lease {fastapi_stream_lease.__version__} with [fastapi] extra")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

