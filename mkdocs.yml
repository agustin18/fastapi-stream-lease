site_name: fastapi-stream-lease
site_description: Distributed concurrency leases for SSE, LLM streams, and WebSockets on FastAPI and Starlette.
site_url: https://agustin18.github.io/fastapi-stream-lease/
repo_url: https://github.com/agustin18/fastapi-stream-lease
repo_name: agustin18/fastapi-stream-lease
edit_uri: edit/main/docs/
copyright: MIT licensed

exclude_docs: |
  distribution_playbook.md
  launch.md
  demo.tape

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - FAQ: faq.md
  - Guides:
      - SSE and streaming: guides/sse.md
      - Production deployment: guides/production.md
      - Observability: guides/observability.md
      - Failure model: guides/failure-model.md
  - API reference: api.md
  - Changelog: changelog.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agustin18/fastapi-stream-lease
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi-stream-lease/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
